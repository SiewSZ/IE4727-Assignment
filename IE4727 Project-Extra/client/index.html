<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Quantum Gear: PC parts and consumer electronics in Singapore">
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/icon-192.png">
    <meta name="theme-color" content="#020617">
    <title>Quantum Gear</title>
    <!-- Apply the saved theme before React loads, so a light-mode visitor never sees a dark flash -->
    <script>
        try {
            if (localStorage.getItem("theme") !== "light") document.documentElement.classList.add("dark");
        } catch {
            document.documentElement.classList.add("dark");
        }
    </script>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
</body>
</html>
